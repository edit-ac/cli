[package]
name = "editac-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/edit-ac/cli"
description = "Local-first edit.ac editor client scaffold; editing commands are not implemented"
publish = false

[dependencies]
# Reviewed immutable vendored source; see vendor/core/provenance.json.
editac-core = { path = "vendor/core/crates/editac-core" }
editac-markdown = { path = "vendor/core/crates/editac-markdown" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"

# Decode checkpoint state for order-independent admission; never mutate engine roots.
yrs = "=0.28.0"

[[bin]]
name = "editac"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
