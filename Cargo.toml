[package]
name = "editac-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/edit-ac/cli"
description = "Local-first edit.ac editor client scaffold; editing commands are not implemented"
publish = false

[dependencies]
# Published immutable source; never resolve through a sibling worktree.
editac-core = { git = "https://github.com/edit-ac/core.git", rev = "5b3e96ec259f1cdd8df2971b2192c9cacf225a65" }
editac-markdown = { git = "https://github.com/edit-ac/core.git", rev = "5b3e96ec259f1cdd8df2971b2192c9cacf225a65" }

[[bin]]
name = "editac"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
