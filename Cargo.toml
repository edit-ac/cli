[package]
name = "editac-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/edit-ac/cli"
description = "Local-first Markdown and literal-text editor with optional configured hosted synchronization"
publish = false

[dependencies]
unicode-segmentation = "=1.12.0"
unicode-width = "=0.2.2"
# TUI-1.2: bounded backend decision in architecture/decisions/tui-backend.md.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "bracketed-paste", "windows"] }

# Reviewed immutable vendored source; see vendor/core/provenance.json.
editac-core = { path = "vendor/core/crates/editac-core" }
editac-markdown = { path = "vendor/core/crates/editac-markdown" }
editac-session = { path = "vendor/core/crates/editac-session", features = ["native-store"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"

# Decode checkpoint state for order-independent admission; never mutate engine roots.
yrs = "=0.28.0"

[[bin]]
name = "editac"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
